### navsat_transform_node configuration ###
# Moving-start initialization.
# The node auto-starts from the first valid GPS fix and uses the local odometry
# heading during the initial straight-line motion that establishes world-lock.
navsat_transform_node:
    ros__parameters:

        # --- Frame / frequency ---
        frequency: 30.0

        # How long to wait (s) before reporting a failure to acquire a datum.
        delay: 3.0

        # Use the local odometry yaw while the robot moves off from its starting
        # point. This restores moving-start world-lock and avoids requiring a
        # manual datum service call before GPS odometry can publish.
        use_odometry_yaw: true

        # Start publishing as soon as GPS and odometry are available.
        wait_for_datum: false

        # Magnetic declination is only relevant when navsat_transform_node is
        # using a north-referenced heading source. In the default moving-start
        # path above, keep it neutral unless you explicitly override it at
        # launch-time for a different heading source or calibration experiment.
        magnetic_declination_radians: 0.0

        # Yaw offset applied to the converted GPS odometry (radians).
        # Set to 0.0; any fixed offset should be calibrated in the field.
        yaw_offset: 0.0

        # Whether to zero-out the altitude component of the GPS-derived odometry.
        # Keep true for ground robots operating in 2-D mode.
        zero_altitude: true

        # Whether to broadcast the map->odom transform.  Set false because a
        # separate EKF instance (world_frame: map) handles that transform.
        broadcast_utm_transform: false

        # Publish UTM->map transform as child->parent (false = standard).
        broadcast_utm_transform_as_parent_frame: false

        # Publish a filtered GPS position topic for diagnostics.
        # Useful for verifying that the datum was set correctly.
        publish_filtered_gps: true
