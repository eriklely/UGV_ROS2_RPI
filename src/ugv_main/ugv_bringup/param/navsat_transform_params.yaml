### navsat_transform_node configuration ###
# Explicit-datum initialization.
# The node waits for an explicit /navsat_transform_node/set_datum service call
# before publishing /odometry/gps.  This guarantees a known, correct map-frame
# origin and avoids publishing garbage values during startup.
#
# Datum initialization workflow
# ──────────────────────────────
# 1. Launch the localization stack:
#      ros2 launch ugv_bringup bringup_imu_ekf.launch.py use_gps:=true
#
# 2. Wait for a good GPS fix:
#      ros2 topic echo /gps/fix --once   # status.status >= 0 = fix acquired
#
# 3. Set the datum (locks the map-frame origin to a known lat/lon):
#      ros2 run ugv_bringup set_datum --lat 52.06298566666667 \
#                                     --lon 5.114725833333333 \
#                                     --alt 2.3
#    Or using the bash helper:
#      bash set_gps_datum.sh 52.06298566666667 5.114725833333333 2.3
#    Or via a raw service call:
#      ros2 service call /navsat_transform_node/set_datum \
#        robot_localization/srv/SetDatum \
#        "{latitude: 52.06298566666667, longitude: 5.114725833333333, altitude: 2.3}"
#
# 4. Verify — /odometry/gps should now show:
#      frame_id: map          (was: odom  → wrong)
#      child_frame_id: odom   (was: ''   → empty)
#      position: small values near (0, 0)
#
# 5. Begin navigation only after step 4 passes.
navsat_transform_node:
    ros__parameters:

        # --- Frame / frequency ---
        frequency: 30.0

        # How long to wait (s) before reporting a failure to acquire a datum.
        delay: 3.0

        # Use an explicit /set_datum service call instead of auto-deriving the
        # heading from robot movement.  This prevents garbage /odometry/gps
        # output during the initialization phase.
        use_odometry_yaw: false

        # Wait for an explicit /navsat_transform_node/set_datum service call
        # before publishing /odometry/gps.  This is the recommended mode for
        # outdoor operations where a known origin is required.
        wait_for_datum: true

        # Magnetic declination for your location (radians).
        # Applied to align the GPS-derived heading with True North.
        #
        # Calibration reference (approximate regional values):
        #   Netherlands / Western Europe : +0.1047  (~6° E, 52°N 5°E — 2026)
        #   Eastern US (e.g. New York)   : -0.2182  (~-12.5° W)
        #   Western US (e.g. California) : +0.2269  (~13° E)
        #   Central Europe (Germany)     : +0.0698  (~4° E)
        #   East Asia (Japan / Korea)    : -0.1222  (~-7° W)
        #   Australia (Sydney)           : +0.2182  (~12.5° E)
        #
        # To look up the precise value for your coordinates visit:
        #   https://www.ngdc.noaa.gov/geomag/calculators/magcalc.shtml
        # Convert degrees → radians: radians = degrees × π/180
        #
        # Override at runtime without editing this file:
        #   ros2 launch ugv_bringup bringup_imu_ekf.launch.py \
        #       use_gps:=true mag_declination:=0.1047
        magnetic_declination_radians: 0.1047   # ~6° E  (Netherlands, 52°N 5°E)

        # Yaw offset applied to the converted GPS odometry (radians).
        # Set to 0.0; any fixed offset should be calibrated in the field.
        yaw_offset: 0.0

        # Whether to zero-out the altitude component of the GPS-derived odometry.
        # Keep true for ground robots operating in 2-D mode.
        zero_altitude: true

        # Whether to broadcast the map->odom transform.  Set false because a
        # separate EKF instance (world_frame: map) handles that transform.
        broadcast_utm_transform: false

        # Publish UTM->map transform as child->parent (false = standard).
        broadcast_utm_transform_as_parent_frame: false

        # Publish a filtered GPS position topic for diagnostics.
        # Useful for verifying that the datum was set correctly.
        publish_filtered_gps: true
